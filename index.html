<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой слуховой аппарат</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background: #6200ee;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            margin: 5px 0;
            cursor: pointer;
        }
        #startBtn.active {
            background: #00c851;
        }
        #stopBtn {
            background: #ff4444;
        }
        .slider-container {
            margin: 20px 0;
        }
        .status {
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            margin: 10px 0;
        }
        .status-on {
            background: #00c851;
            color: white;
        }
        .status-off {
            background: #ff4444;
            color: white;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Простой слуховой аппарат</h1>
        <p>Базовая версия для Redmi/Xiaomi</p>
        
        <button id="startBtn">🎤 Включить микрофон</button>
        <button id="stopBtn" disabled>🔴 Выключить</button>
        <div class="status status-off" id="status">Микрофон выключен</div>
    </div>

    <div class="panel">
        <h2>Настройки громкости</h2>
        <div class="slider-container">
            <label for="volumeSlider">Громкость: <span id="volumeValue">100%</span></label>
            <input type="range" id="volumeSlider" min="50" max="300" value="100" style="width:100%">
        </div>
    </div>

    <script>
        // Элементы интерфейса
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const statusEl = document.getElementById('status');

        // Аудио-переменные
        let audioContext;
        let microphone;
        let audioStream;
        let gainNode;
        let isActive = false;

        // Включение микрофона (упрощенная версия)
        async function startMicrophone() {
            try {
                statusEl.textContent = 'Запуск...';
                
                // Создаём аудиоконтекст
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Получаем доступ к микрофону (максимально простые настройки)
                audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: true 
                }).catch(err => {
                    statusEl.textContent = 'Ошибка доступа к микрофону';
                    throw err;
                });

                // Создаем усиление
                microphone = audioContext.createMediaStreamSource(audioStream);
                gainNode = audioContext.createGain();
                gainNode.gain.value = volumeSlider.value / 100 * 3; // Усиление в 3 раза
                
                // Подключаем
                microphone.connect(gainNode).connect(audioContext.destination);
                
                // Обновляем интерфейс
                startBtn.classList.add('active');
                stopBtn.disabled = false;
                statusEl.textContent = 'Микрофон включен';
                statusEl.className = 'status status-on';
                isActive = true;

            } catch (error) {
                statusEl.textContent = 'Ошибка: ' + error.message;
                console.error(error);
            }
        }

        // Выключение микрофона
        function stopMicrophone() {
            if (isActive) {
                // Отключаем все
                if (microphone) microphone.disconnect();
                if (audioStream) audioStream.getTracks().forEach(track => track.stop());
                if (audioContext) audioContext.close();
                
                // Обновляем интерфейс
                startBtn.classList.remove('active');
                stopBtn.disabled = true;
                statusEl.textContent = 'Микрофон выключен';
                statusEl.className = 'status status-off';
                isActive = false;
            }
        }

        // Обработчики событий
        startBtn.addEventListener('click', startMicrophone);
        stopBtn.addEventListener('click', stopMicrophone);
        
        volumeSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            volumeValue.textContent = `${value}%`;
            if(gainNode) gainNode.gain.value = value / 100 * 3;
        });

        // Автовосстановление при сворачивании
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && isActive && audioContext?.state === 'suspended') {
                audioContext.resume();
            }
        });
    </script>
</body>
</html>
