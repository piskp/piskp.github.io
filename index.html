<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Усилитель окружающих звуков</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f0f0f0;
        }
        .panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            margin: 5px 0;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:active {
            transform: scale(0.98);
        }
        #startBtn.active {
            background: #2E7D32;
        }
        #stopBtn {
            background: #f44336;
        }
        .slider-container {
            margin: 20px 0;
        }
        .status {
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }
        .status-on {
            background: #2E7D32;
            color: white;
        }
        .status-off {
            background: #f44336;
            color: white;
        }
        input[type="range"] {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>🔊 Усилитель окружающих звуков</h1>
        <p>Слышите всё вокруг чётко и громко</p>
        
        <button id="startBtn">🎤 Включить микрофон</button>
        <button id="stopBtn" disabled>⏹️ Выключить</button>
        <div class="status status-off" id="status">Микрофон выключен</div>
    </div>

    <div class="panel">
        <h2>⚙️ Настройки</h2>
        <div class="slider-container">
            <label for="volumeSlider">Громкость: <span id="volumeValue">100%</span></label>
            <input type="range" id="volumeSlider" min="50" max="500" value="100">
        </div>
        <div class="slider-container">
            <label for="delaySlider">Задержка: <span id="delayValue">0.1 сек</span></label>
            <input type="range" id="delaySlider" min="1" max="20" value="10">
        </div>
    </div>

    <script>
        // Элементы интерфейса
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const delaySlider = document.getElementById('delaySlider');
        const delayValue = document.getElementById('delayValue');
        const statusEl = document.getElementById('status');

        // Аудио-переменные
        let audioContext;
        let mediaStream;
        let gainNode;
        let delayNode;
        let isActive = false;

        // Включение микрофона
        async function startMicrophone() {
            try {
                statusEl.textContent = 'Запуск...';
                
                // Создаём аудиоконтекст
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Получаем доступ к микрофону с настройками для окружающих звуков
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                // Создаем узлы обработки
                const source = audioContext.createMediaStreamSource(mediaStream);
                gainNode = audioContext.createGain();
                delayNode = audioContext.createDelay(2.0);
                
                // Начальные значения
                gainNode.gain.value = volumeSlider.value / 100 * 5; // Усиление в 5 раз
                delayNode.delayTime.value = delaySlider.value / 10;
                
                // Подключаем цепочку: микрофон → задержка → усиление → выход
                source.connect(delayNode).connect(gainNode).connect(audioContext.destination);
                
                // Обновляем интерфейс
                startBtn.classList.add('active');
                stopBtn.disabled = false;
                statusEl.textContent = 'Микрофон включен - слушаем окружающие звуки';
                statusEl.className = 'status status-on';
                isActive = true;

            } catch (error) {
                statusEl.textContent = 'Ошибка: ' + error.message;
                console.error(error);
            }
        }

        // Выключение микрофона
        function stopMicrophone() {
            if (isActive) {
                // Отключаем все
                if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
                if (audioContext) audioContext.close();
                
                // Обновляем интерфейс
                startBtn.classList.remove('active');
                stopBtn.disabled = true;
                statusEl.textContent = 'Микрофон выключен';
                statusEl.className = 'status status-off';
                isActive = false;
            }
        }

        // Обработчики событий
        startBtn.addEventListener('click', startMicrophone);
        stopBtn.addEventListener('click', stopMicrophone);
        
        volumeSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            volumeValue.textContent = `${value}%`;
            if(gainNode) gainNode.gain.value = value / 100 * 5;
        });

        delaySlider.addEventListener('input', (e) => {
            const value = e.target.value / 10;
            delayValue.textContent = `${value.toFixed(1)} сек`;
            if(delayNode) delayNode.delayTime.value = value;
        });

        // Автовосстановление
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && isActive && audioContext?.state === 'suspended') {
                audioContext.resume();
            }
        });
    </script>
</body>
</html>
